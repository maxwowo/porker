name: Deploy room worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.worker.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-room-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy porker-rooms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Account IDs are not secret. Pinning it also avoids needing Account:Read
      # on the deploy token.
      CLOUDFLARE_ACCOUNT_ID: 25a1f8af52c8c4dce100c6258778c67e
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc -p tsconfig.worker.json --noEmit

      - name: Run worker tests
        run: npm run test:worker

      - name: Deploy
        run: npm run deploy:rooms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
