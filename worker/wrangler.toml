# Internal worker bound to the `porkr` Pages project. Deployed by
# .github/workflows/deploy-worker.yml when worker or shared code changes.
name = "porker-rooms"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[exports.Room]
type = "durable-object"
storage = "sqlite"
